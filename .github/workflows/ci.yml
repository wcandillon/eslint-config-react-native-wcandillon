name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - name: Install dependencies
      run: yarn install --frozen-lockfile
    - name: Run tests
      run: yarn test

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: deployment
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # to push tags and create the GitHub release
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests
      id-token: write # to mint the OIDC token for npm trusted publishing and provenance
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # semantic-release needs full history and tags
        persist-credentials: false
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'yarn'
        # No registry-url: setup-node would write a placeholder NODE_AUTH_TOKEN
        # into .npmrc, which can shadow the OIDC token exchange.
    - name: Install dependencies
      run: yarn install --frozen-lockfile
    - name: Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No NPM_TOKEN: @semantic-release/npm exchanges the GitHub OIDC
        # id-token for a short-lived npm token (trusted publishing) and npm
        # attaches provenance attestations automatically. The trusted
        # publisher on npmjs.com must allow the "npm publish" action, not
        # only "npm stage publish" (the default since 2026-09-03).
        NPM_TOKEN: ''
        NPM_CONFIG_PROVENANCE: true
      run: yarn semantic-release
